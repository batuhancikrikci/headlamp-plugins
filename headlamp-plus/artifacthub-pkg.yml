install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Headlamp Plus" and install it. Alternatively,
  download `headlamp-plus-0.1.0.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: headlamp-plus
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/headlamp-plus
          version: 0.1.0
  ```
