install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Headlamp Plus" and install it. Alternatively,
  download `headlamp-plus-0.2.0.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: headlamp-plus
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/headlamp-plus
          version: 0.2.0
  ```
changes:
  - kind: added
    description: "**Namespace overview** at the top of each namespace page: pods, workloads, jobs and volume claims; what needs attention, including claims that stay unbound and quotas at 90 % or more; the use of every ResourceQuota, or the pods' requests against their usage when there is no quota; the pods using the most CPU and memory (metrics API); and the usage trend. Headlamp's own sections (quotas, limit ranges, pods, events) stay below it."
  - kind: added
    description: "**Usage trend** on the cluster and namespace dashboards: CPU and memory used over the last hour, 6 hours, day or week from Prometheus (cAdvisor container metrics), with the allocatable capacity or the namespace quota as a dashed line. A Prometheus compatible service is found automatically or can be entered by hand for the session."
