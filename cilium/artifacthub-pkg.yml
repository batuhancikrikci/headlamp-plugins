install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Cilium" and install it. Alternatively,
  download `cilium-0.2.0.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: cilium
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/cilium
          version: 0.2.0
  ```
changes:
  - kind: added
    description: "**Cluster Mesh** page: this cluster's name and ID with what keeps it out of a mesh, the Cluster Mesh settings of `cilium-config`, the Cluster Mesh API server (pods, version, KVStoreMesh, how other clusters reach its Service), and the remote clusters from the `clustermesh-remote-users` ConfigMap, the agents' host aliases and, when Prometheus has them, the agents' `cilium_clustermesh_remote_cluster_*` metrics (ready agents, failures in the last hour, last failure). The `cilium-clustermesh` Secret is not read."
  - kind: added
    description: "**Global services**: the services marked `service.cilium.io/global` with their shared, affinity and EndpointSlice sync settings, filtered by namespace; a dialog edits them (merge patch of the annotations) and makes other services global. Global services also show the settings in the Cilium section of Headlamp's Service page."
  - kind: added
    description: "**Connect clusters** wizard: takes the Cilium values of two clusters (name, ID, maximum of connected clusters, routing mode, version, pod CIDRs, API server address) as entered, the first one optionally filled in from the cluster on the page, checks the documented prerequisites (unique names and IDs, the same maximum of connected clusters, the same datapath mode, non-overlapping pod CIDRs, Cilium versions, API servers) and gives the `cilium clustermesh` commands or the Helm values for both sides. It applies nothing."
