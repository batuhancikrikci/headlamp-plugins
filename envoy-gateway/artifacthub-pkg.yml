install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Envoy Gateway" and install it. Alternatively,
  download `envoy-gateway-0.1.1.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: envoy-gateway
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/envoy-gateway
          version: 0.1.1
  ```
changes:
  - kind: fixed
    description: "Policies and routes no longer look broken because of old status entries the controller left behind for removed targets or parents; the policy status and the route problems of the Overview only consider entries the controller still maintains."
