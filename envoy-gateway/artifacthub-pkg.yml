install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Envoy Gateway" and install it. Alternatively,
  download `envoy-gateway-0.1.2.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: envoy-gateway
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/envoy-gateway
          version: 0.1.2
  ```
changes:
  - kind: fixed
    description: "Opening an object from a reference link (for example the target HTTPRoute in a policy list) crashed its details page with \"Cannot read properties of undefined (reading 'rules')\". The link handed Headlamp a name-only object, which the details page rendered instead of loading the real one; it now only navigates."
