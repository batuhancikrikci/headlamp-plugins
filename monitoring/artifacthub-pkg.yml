install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Monitoring" and install it. Alternatively,
  download `monitoring-0.4.0.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: monitoring
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/monitoring
          version: 0.4.0
  ```
changes:
  - kind: added
    description: "Backtest for alerting rules in the PrometheusRule form: the expression is run as a range query over the last 1 hour to 7 days at the evaluation interval of its group, and the form shows how often, when and on which series the alert would have fired, taking `for` and `keep_firing_for` into account. Nothing is saved or sent to Alertmanager."
