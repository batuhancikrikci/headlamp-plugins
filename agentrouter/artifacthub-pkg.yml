install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Agent Router" and install it. Alternatively,
  download `agentrouter-0.3.0.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: agentrouter
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/agentrouter
          version: 0.3.0
  ```
changes:
  - kind: added
    description: "Token usage on the overview: input and output tokens and requests per model over the last hour, day or week, from the `gen_ai_client_token_usage` metrics Agent Router exports."
  - kind: added
    description: "Estimated quota fill on the overview and the QuotaPolicy page, for default buckets and service quotas: the total tokens of the backend and model over the quota window, since the quota service does not export its counters. Quotas with a custom cost expression or a one-second window are shown without an estimate."
  - kind: added
    description: "Prometheus (or Thanos, Mimir, VictoriaMetrics) is found automatically through the Kubernetes service proxy; another service can be entered as `namespace/service:port` for the session."
