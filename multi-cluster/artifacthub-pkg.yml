install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Multicluster Hub" and install it. Alternatively,
  download `multi-cluster-0.2.1.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: multi-cluster
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/multi-cluster
          version: 0.2.1
  ```
changes:
  - kind: fixed
    description: "Opening an object from a reference link could crash its details page (for example \"Cannot read properties of undefined\"). The link handed Headlamp a name-only object, which the details page rendered instead of loading the real one; it now only navigates."
