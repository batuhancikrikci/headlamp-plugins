install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Multicluster Hub" and install it. Alternatively,
  download `multi-cluster-0.2.0.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: multi-cluster
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/multi-cluster
          version: 0.2.0
  ```
changes:
  - kind: added
    description: "Compliance matrix on the Policies tab: every root policy against every cluster it is placed on, with the compliance of each cell, links to the policy and the cluster, and a filter that keeps only non-compliant and pending policies and clusters."
