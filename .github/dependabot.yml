version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Major versions can change behaviour; they are upgraded deliberately, not by Dependabot.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directories:
      - /agentrouter
      - /cilium
      - /envoy-gateway
      - /gateway
      - /headlamp-plus
      - /inference-hub
      - /monitoring
      - /multi-cluster
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      headlamp-plugin:
        patterns: ['@kinvolk/headlamp-plugin']
      dependencies:
        patterns: ['*']
        exclude-patterns: ['@kinvolk/headlamp-plugin']
