install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Inference Hub" and install it. Alternatively,
  download `inference-hub-0.6.0.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: inference-hub
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/inference-hub
          version: 0.6.0
  ```
changes:
  - kind: changed
    description: "New model server picker in the Playground (chat, benchmark, embed & rerank) and in \"Ask a model\": the field shows the chosen server with its model and health, and opens a panel with a namespace filter (remembered for the session), a search over names and models, a filter for endpoints, gateway routes and vLLM pods, and \"ready only\"."
  - kind: fixed
    description: "Choosing a model in the Playground could be undone by the background refresh: the rebuilt list reset the picker's search and highlight, and a server that dropped out of the list for a moment cleared the chosen one. Unchanged entries now keep their objects, and the chosen server stays until another one is picked."
