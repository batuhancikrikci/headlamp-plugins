install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Inference Hub" and install it. Alternatively,
  download `inference-hub-0.5.0.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: inference-hub
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/inference-hub
          version: 0.5.0
  ```
changes:
  - kind: added
    description: "Namespace quota check in the resources and scaling steps of the deploy wizard and the edit form: the model server pods (at the minimum and at the autoscaling maximum) against every ResourceQuota of the namespace for GPUs, CPU, memory and pods. A quota on CPU limits is flagged, since the pods set no CPU limit, unless a LimitRange gives a default. When an endpoint is edited, its current pods count as released. Scoped quotas are not checked."
  - kind: added
    description: "The GPU quota and usage of the namespace's Kueue queues (LocalQueue → ClusterQueue) are shown next to it, and Kueue appears as an optional stack in the platform readiness check."
  - kind: added
    description: "Playground tool calling: function definitions in the OpenAI format (with an example) and the tool choice are sent with each message. The calls the model makes are shown with their arguments (invalid JSON is flagged); the results entered for them go back to the model, which continues the answer. A server without tool calling set up gets a hint about vLLM's `--enable-auto-tool-choice` and `--tool-call-parser`."
  - kind: added
    description: "Playground image input for vision-language models: up to four PNG, JPEG, WebP or GIF images per message, scaled down to 1536 px; \"Copy as curl\" leaves the image data out."
  - kind: added
    description: "Playground **Embed & rerank** mode for pooling models: embeds texts with `/v1/embeddings` and shows their cosine similarity, or orders documents by relevance to a query with `/v1/rerank`, with tokens and latency."
