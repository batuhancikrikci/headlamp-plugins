install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Inference Hub" and install it. Alternatively,
  download `inference-hub-0.6.1.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: inference-hub
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/inference-hub
          version: 0.6.1
  ```
changes:
  - kind: fixed
    description: "The namespace filter and the search field of the model server picker sit on the same line."
  - kind: fixed
    description: "The Playground warned \"You are not allowed to use the services proxy\" for every target reached through a gateway, even for cluster administrators. The permission is not checked for those targets, and the skipped check was taken as a denial; the warning now only follows a check the API server denied."
  - kind: changed
    description: "A target reached through a gateway shows the implementation that runs the gateway, from its GatewayClass (Envoy Gateway, Istio, kgateway, Cilium, NGINX Gateway Fabric, Traefik, GKE, or the controller name). Envoy Gateway `SecurityPolicy` hints are named as such and only shown when Envoy Gateway runs the gateway (or its class cannot be read); with another implementation a note says its policies are not read and that request headers can still be added."
