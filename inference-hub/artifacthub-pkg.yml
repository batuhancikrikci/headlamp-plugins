install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Inference Hub" and install it. Alternatively,
  download `inference-hub-0.4.0.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: inference-hub
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/inference-hub
          version: 0.4.0
  ```
changes:
  - kind: added
    description: "Playground, Benchmark and Ask a model can reach an endpoint through a gateway: through the route KServe manages for an LLMInferenceService or through an Agent Router route, so the requests run the gateway's routing, llm-d scheduler and policies. The Envoy Gateway SecurityPolicy of the gateway or route is explained, and request headers such as an API key can be added for the session."
  - kind: added
    description: "Benchmark concurrency sweep: the test at 1, 2, 4, … concurrent requests up to the chosen maximum, stopping at the first level that misses a TTFT p95 goal. The highest level within the goal gives the load one replica handles and the replicas for an expected peak, with the autoscaling YAML (a KEDA trigger on the running and waiting requests of an LLMInferenceService, the concurrency target of an InferenceService) and a link to the edit form with those replicas."
  - kind: added
    description: "The edit form and the edit wizard warn when someone changes or deletes the endpoint while it is being edited; Reload starts again from the current version."
  - kind: removed
    description: "Benchmark no longer keeps the last runs in the browser, and removes the runs stored by 0.3.0. Export a run as CSV or JSON to keep it."
  - kind: changed
    description: "The scaling step explains that LLMInferenceService autoscaling needs KEDA triggers in spec.scaling.keda on KServe 0.21 and later (the workload variant autoscaler on earlier releases)."
  - kind: changed
    description: "Pods are listed per GPU node instead of across the whole cluster, and the warning events of the Command Center per endpoint namespace (plus `default`, where cluster-scoped objects such as ClusterPolicy record theirs), so pages stay light on clusters with thousands of pods. vLLM servers that run on nodes without GPUs are no longer listed."
  - kind: fixed
    description: "Saving an edit no longer fails when KServe only updated the status of the endpoint since the edit was opened."
  - kind: fixed
    description: "Lists and objects no page uses any more are dropped from memory after five minutes, so a long session no longer keeps every list it ever opened."
