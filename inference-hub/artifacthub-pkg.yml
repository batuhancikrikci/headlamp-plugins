install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Inference Hub" and install it. Alternatively,
  download `inference-hub-0.3.0.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: inference-hub
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/inference-hub
          version: 0.3.0
  ```
changes:
  - kind: added
    description: "Edit endpoints with a form or the deploy wizard: \"Edit\" opens one page with the settings of the live endpoint and the review below them; \"Switch to the wizard\" opens the same edit as the steps of the deploy wizard, keeping what was entered. Both change only the settings you touch, keep everything the form does not show, and review the change as a YAML diff before saving with the live resourceVersion. The placement check counts the GPUs of the edited endpoint as free. The model and the served model name of an endpoint cannot change in any edit, Edit YAML included."
  - kind: added
    description: "Diagnose tab on the endpoint page: checks the conditions, the model cache, scheduling, image pulls, crashes and OOM kills, the model download, readiness and the llm-d scheduler, and on request scans the logs for known failures, each with evidence and a fix. The Command Center links endpoints that need attention to it."
  - kind: added
    description: "Ask a model: sends the diagnosis (secrets masked, reviewed before sending) to another model running in the cluster through the Kubernetes API proxy and shows its answer and reasoning. Follow-up questions continue the conversation; each request sends the whole conversation, and New conversation starts over. The token limit is set in the panel (16384 by default), Thinking can be turned off for models whose chat template reads enable_thinking (Qwen3 and others), an answer cut off by the limit, stopped or interrupted by an error can be continued, and a request that does not fit in the model's context length says so. It has a switch in Settings."
  - kind: added
    description: "Publish to Agent Router: the endpoint page lists the AI routes that use the endpoint and adds a rule for its model names to an existing or new AIGatewayRoute, through its InferencePool or through a Backend and AIServiceBackend owned by the endpoint, with a ReferenceGrant for other namespaces. Agent Router appears as an optional stack in Platform Readiness."
  - kind: added
    description: "GPU Efficiency page: GPU utilization, requests and tokens per GPU-hour of every endpoint and GPU pod over 1 hour, 24 hours or 7 days, idle and underused workloads with a stop action, and the idle GPUs of the last hour in the Command Center."
  - kind: added
    description: "Benchmark mode in the Playground: latency and throughput of one or two endpoints under a fixed concurrency, with the peak queue and KV cache use of the servers, CSV and JSON export and the last runs kept in the browser."
  - kind: fixed
    description: "InferencePools and routes no longer look failed because of old status entries of Gateways that no longer route to them."
  - kind: changed
    description: "The deploy wizard suggests served model names without the organization, in lowercase and without dots, e.g. `qwen35-122b-a10b-fp8` for `hf://Qwen/Qwen3.5-122B-A10B-FP8`."
  - kind: changed
    description: "Updated the bundled Simple Icons set."
