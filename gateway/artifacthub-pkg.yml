install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Gateway API" and install it. Alternatively,
  download `gateway-0.1.1.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: gateway
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/gateway
          version: 0.1.1
  ```
changes:
  - kind: fixed
    description: "A route whose parent was changed no longer stays Pending because of the status entry the controller left behind for the removed parent; the Overview condition count ignores it too."
  - kind: fixed
    description: "A BackendTLSPolicy no longer stays Pending because of ancestors the controller stopped maintaining (for example after a target was removed)."
