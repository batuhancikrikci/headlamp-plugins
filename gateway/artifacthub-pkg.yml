install: |
  ## Headlamp desktop

  Open the plugin catalog in Headlamp, search for "Gateway API" and install it. Alternatively,
  download `gateway-0.2.0.tar.gz` from the GitHub release and extract it into the Headlamp plugins
  directory (for example `~/.config/Headlamp/plugins/` on Linux), then reload Headlamp.

  ## Headlamp in-cluster

  Enable the plugin manager of the Headlamp Helm chart:

  ```yaml
  pluginsManager:
    enabled: true
    configContent: |
      plugins:
        - name: gateway
          source: https://artifacthub.io/packages/headlamp/batuhancikrikci-headlamp-plugins/gateway
          version: 0.2.0
  ```
changes:
  - kind: added
    description: "**GRPCRoute wizard**: parents → hostnames → methods (fully qualified service and optional method, with header matches) → filters → backends → summary, like the HTTPRoute wizard. The Create button of GRPCRoutes opens it; the form and YAML stay available."
